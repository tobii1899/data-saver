name: Daily Option Chain Collector

on:
  schedule:
    # 21:00 UTC = 16:00 ET (Winter) / 17:00 ET (Summer) — after US market close
    # Runs Monday–Friday
    - cron: "0 21 * * 1-5"

  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the CSV files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run collector
        run: python scripts/collect.py

      - name: Commit and push new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit when there is actually something new
          git diff --cached --quiet || git commit -m "chore: option chains $(date -u +%Y-%m-%d)"
          git push
